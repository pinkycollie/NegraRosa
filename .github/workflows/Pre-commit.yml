- name: pre-commit
uses: fredclausen/pre-commit-autoupdate@v1.0.0, uses: pre-commit/action@v3.0.1,  
  with:
    # The token that the action will use to create and update the pull request.
    token: # optional, default is ${{ github.token }}
    # Version of Python to use when installing pre-commit
    python_version: # optional, default is 3.14
    # Version of pre-commit to install
    pre_commit_version: # optional, default is 4.6.0
    # Whether to create a PR review suggesting fixes if pre-commit checks fail
    suggest_fixes: # optional, default is false
    # String of options to pass to `pre-commit autoupdate` command
    extra-args: --all-files
    
    libs:

  name: pre-commit-uv
  # You may pin to the exact commit or the version.
  # uses: tox-dev/action-pre-commit-uv@246b66536e366bb885f52d61983bf32f7c95e8b1
  uses: tox-dev/action-pre-commit-uv@1.0.3
  with:
    # options to pass to pre-commit run
    extra_args: # optional, default is --all-files
